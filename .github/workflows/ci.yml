name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      # Run ESLint; capture exit code so we can fail the job after SARIF upload
      - name: Run ESLint
        id: eslint
        run: |
          set +e
          bunx eslint . \
            --format=@microsoft/eslint-formatter-sarif \
            --output-file=eslint-results.sarif
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          if [ ! -f eslint-results.sarif ]; then
            echo "ESLint did not produce eslint-results.sarif"
            exit 1
          fi

      - name: Upload ESLint SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('eslint-results.sarif') != ''
        with:
          sarif_file: eslint-results.sarif
          category: eslint

      - name: Fail job on ESLint errors
        if: steps.eslint.outputs.exit_code != '0'
        run: |
          echo "ESLint failed with exit code ${{ steps.eslint.outputs.exit_code }}"
          exit 1
